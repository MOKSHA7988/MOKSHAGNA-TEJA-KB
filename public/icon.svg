<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle circular radar ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Compass Star / Mountain Geometric Peaks -->
  <g filter="url(#glow)">
    <!-- Back Mountain Peak -->
    <polygon points="170,330 256,180 342,330" fill="#0284c7" opacity="0.6"/>
    <!-- Front Majestic Mountain Peak -->
    <polygon points="210,340 286,210 362,340" fill="url(#accentGrad)" opacity="0.9"/>
    <!-- Left Accent Peak -->
    <polygon points="150,340 215,240 280,340" fill="#059669" opacity="0.8"/>
  </g>

  <!-- Stylized Modern Jet / Travel Vector traversing upwards -->
  <g transform="translate(256, 195) rotate(-35) translate(-256, -195)">
    <!-- Jet Body -->
    <path d="M256,120 L270,190 L325,220 L325,232 L270,212 L270,265 L288,280 L288,290 L256,282 L224,290 L224,280 L242,265 L242,212 L187,232 L187,220 L242,190 Z" fill="#ffffff"/>
    <circle cx="256" cy="130" r="4" fill="#06b6d4"/>
  </g>

  <!-- Location Pin Accent -->
  <circle cx="256" cy="256" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="4"/>

  <!-- MG Brand Signature Badge at bottom -->
  <rect x="190" y="375" width="132" height="34" rx="17" fill="#0284c7" fill-opacity="0.85"/>
  <text x="256" y="398" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">MG TRAVEL</text>
</svg>
